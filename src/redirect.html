<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Responsiveness: ensures correct layout on mobile devices and desktop -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctune Player — открываем радиостанцию…</title>
<style>
    /* Reset basic browser styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Center the card on the screen and set dark mode styling */
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121212;
        color: #eaeaea;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 24px;
    }

    /* Glassmorphism translucent card styling */
    .card {
        max-width: 420px;
        width: 100%;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        padding: 28px 26px;
        text-align: center;
    }

    /* Loading spinner CSS animation */
    .spinner {
        width: 34px; height: 34px;
        margin: 0 auto 18px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #bb86fc;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Typography styling */
    h1 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #9a9a9a; line-height: 1.5; }
    .station { color: #eaeaea; font-weight: 600; }

    /* Download button: hidden by default (display: none),
       displayed only if the app fails to launch after a timeout */
    a.btn {
        display: none;
        margin-top: 18px;
        padding: 10px 18px;
        border-radius: 8px;
        background: #bb86fc;
        color: #121212;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
    }
</style>
</head>
<body>
    <!-- Visual user interface displayed when a user clicks the button in Discord -->
    <div class="card">
        <div class="spinner"></div>
        <h1 id="title">Открываем Noctune Player…</h1>
        <p id="status">Если установлен плеер — он сам откроется и запустит станцию <span class="station" id="station-name"></span>.</p>
        <a class="btn" id="fallback-link" href="#">Скачать Noctune Player</a>
    </div>

<script>
    /* 
      =======================================================================
      ARCHITECTURE & WORKING PRINCIPLE (For creating custom redirects):
      =======================================================================
      1. Why is this page necessary?
         Discord prohibits Rich Presence buttons from linking directly to custom 
         URL schemes (e.g., `myapp://...`). Button links MUST begin with `http://` or `https://`.
         This HTML page acts as a "bridge" hosted on your web server or GitHub Pages.

      2. How to pass data from Discord to your desktop application?
         Embed a web URL into the Discord button like this:
         https://yoursite.com/redirect.html?name=Radio%20FM&url=http://stream-link.mp3
         
      3. How is it processed?
         The page reads the GET parameters (`name` and `url`) from the URL query,
         constructs a Deep Link (e.g., `noctune://radio?name=...&url=...`),
         and automatically redirects the browser to trigger the OS protocol handler.
      =======================================================================
    */

    // 1. Read query parameters from the browser's address bar (?name=...&url=...)
    const params = new URLSearchParams(window.location.search);
    
    // Retrieve the 'name' parameter value (fallback to default string if absent)
    const name = params.get('name') || 'радиостанцию';
    
    // Retrieve the 'url' parameter value (stream link or resource target)
    const url = params.get('url') || '';

    // Update the UI text with the station name for visual feedback
    document.getElementById('station-name').textContent = name;

    // 2. Fallback URL for users who do NOT have the application installed.
    // Replace this with your app's download or releases page.
    const FALLBACK_URL = 'https://github.com/PleaseSuffer/NoctunePlayer/releases';

    // 3. Initiate the redirect sequence if a target URL is provided
    if (url) {
        /* 
           DEEP LINK FORMATION (Custom Protocol):
           - `noctune://` is the custom URI scheme registered by the desktop app in the OS.
           - `encodeURIComponent()` prevents special characters in queries from breaking the URI syntax.
        */
        const deepLink = `noctune://radio?name=${encodeURIComponent(name)}&url=${encodeURIComponent(url)}`;
        
        // Trigger browser navigation to the custom protocol.
        // The operating system intercepts this call and launches the registered app.
        window.location.href = deepLink;

        /* 
           FALLBACK / UNINSTALLED APP HANDLING:
           Browsers cannot natively check if a custom URI scheme is installed.
           A timeout is used: if the page remains focused after 2.5 seconds, 
           we assume the application is not installed or the prompt was blocked.
        */
        setTimeout(() => {
            // Update UI elements to prompt user to download the application
            document.getElementById('title').textContent = 'Плеер не открылся?';
            document.getElementById('status').textContent =
                'Похоже, Noctune Player не установлен или браузер заблокировал переход. Скачайте плеер и попробуйте снова.';
            
            const fb = document.getElementById('fallback-link');
            fb.href = FALLBACK_URL;
            fb.style.display = 'inline-block'; // Show the download button
        }, 2500);

    } else {
        // Display an error state if required URL parameters are missing
        document.getElementById('title').textContent = 'Не указана радиостанция';
        document.getElementById('status').textContent = 'В ссылке отсутствуют параметры name/url.';
    }
</script>
</body>
</html>
