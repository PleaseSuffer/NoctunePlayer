<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'">
  <title>Установка темы — Noctune</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="brand">Noctune</span><span class="badge">Новая тема</span></header>
    <img id="preview" alt="Превью темы" hidden>
    <section class="details">
      <p class="eyebrow">Установка темы</p>
      <h1 id="name">Загрузка…</h1>
      <p id="description"></p>
      <dl id="metadata"></dl>
      <p class="note">Тема появится в списке добавленных тем. Вы сможете включить её в настройках плеера.</p>
    </section>
  </main>
  <footer>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="actions"><button id="cancel">Отмена</button><button id="install" class="primary" disabled>Установить</button></div>
  </footer>
</body>
</html>
