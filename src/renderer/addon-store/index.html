<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:; media-src blob:">
    <title data-i18n="marketplace.windowTitle">NocStore</title>
    <link rel="stylesheet" href="../theme-install/style.css">
    <link rel="stylesheet" href="../../shared/settings-controls.css">
    <link rel="stylesheet" href="style.css">
    <script src="../../../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="../../shared/window-appearance.js"></script>
    <script src="previews.js" defer></script>
    <script src="app.js" defer></script>
<script src="../../shared/i18n.js"></script>
<script src="../core/i18n.js"></script>
</head>
<body>
    <header class="store-header">
        <div class="store-identity"><span class="store-mark" aria-hidden="true"><i data-lucide="store"></i></span><span class="brand" data-i18n="marketplace.title">NocStore</span></div>
        <div class="header-actions">
            <label class="preview-setting"><span class="toggle-switch"><input type="checkbox" id="animated-previews" checked><span class="slider-round"></span></span><span data-i18n="addonStore.animatedPreviews">Анимированные превью</span></label>
            <button type="button" id="clear-previews" class="quiet cache-button" title="Кэш превью — до 50 МБ. Старые ролики удаляются автоматически. Нажмите, чтобы очистить сейчас." data-i18n-title="addonStore.previewCacheHint" aria-label="Очистить кэш превью, лимит 50 МБ" data-i18n-aria-label="addonStore.previewCacheAction"><i data-lucide="hard-drive" aria-hidden="true"></i><span id="preview-cache-fill" role="progressbar" aria-label="Заполнение кэша превью" data-i18n-aria-label="addonStore.previewCacheUsage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span><span id="preview-cache-size">0,0 МБ</span></button>
            <button type="button" id="repository" class="quiet" title="Репозиторий" data-i18n-title="settings.about.repository" aria-label="Репозиторий" data-i18n-aria-label="settings.about.repository"><i data-lucide="git-branch" aria-hidden="true"></i><span data-i18n="settings.about.repository">Репозиторий</span></button>
        </div>
    </header>
    <main>
        <section class="intro"><h1 data-i18n="addonStore.makeNoctuneYours">Настройте Noctune под себя</h1><p class="subtitle" data-i18n="addonStore.themesIntegrationsAndAddOnsForYourMusic">Оформление, интеграции и дополнения для вашей музыки.</p></section>
        <div class="tabs section-tabs" role="tablist" aria-label="Раздел магазина" data-i18n-aria-label="marketplace.sections">
            <button id="tab-extensions" role="tab" aria-selected="true" aria-controls="store-results"><i data-lucide="puzzle"></i><span data-i18n="player.interface.extensions">Расширения</span></button>
            <button id="tab-themes" role="tab" aria-selected="false" aria-controls="store-results" tabindex="-1"><i data-lucide="palette"></i><span data-i18n="addonPermissions.themes">Темы</span></button>
        </div>
        <div class="store-toolbar">
            <div class="tabs" role="tablist" aria-label="Каталоги расширений" data-i18n-aria-label="addonStore.extensionCatalogs">
                <button type="button" id="tab-official" role="tab" aria-selected="true" aria-controls="store-results"><i data-lucide="badge-check"></i><span data-i18n="addonStore.official">Официальные</span><span id="official-count" class="count"></span></button>
                <button type="button" id="tab-community" role="tab" aria-selected="false" aria-controls="store-results" tabindex="-1"><i data-lucide="users"></i><span data-i18n="addonStore.community">Пользовательские</span><span id="community-count" class="count"></span></button>
            </div>
        </div>
        <section id="store-results" role="tabpanel" aria-labelledby="tab-extensions tab-official">
            <div class="search-row"><label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="Найти расширение" aria-label="Поиск официальных расширений" maxlength="120" data-i18n-placeholder="addonStore.findExtension" data-i18n-aria-label="addonStore.searchOfficialExtensions"></label>
                <button type="button" id="refresh" class="quiet refresh-button" title="Обновить каталог" data-i18n-title="addonStore.refreshCatalog" aria-label="Обновить каталог" data-i18n-aria-label="addonStore.refreshCatalog"><i data-lucide="refresh-cw"></i><span data-i18n="addonStore.refresh">Обновить</span></button>
            </div>
            <p class="catalog-source" id="catalog-source" role="status" data-i18n="addonStore.noctuneCatalog">Каталог Noctune</p>
            <p class="catalog-message" id="catalog-message" role="status"></p>
            <div id="catalog" class="catalog" aria-live="polite"></div>
            <p id="empty" class="empty" hidden></p>
        </section>
        <div id="community-actions" class="community-actions" hidden>
            <p id="community-note" class="community-note" hidden data-i18n="marketplace.communityNote">Работа пользовательских дополнений зависит от авторов и сторонних сервисов.</p>
            <button type="button" id="documentation"><i data-lucide="book-open"></i><span data-i18n="marketplace.publishGuide">Как опубликовать дополнение или тему</span></button><button type="button" id="submission"><i data-lucide="git-pull-request"></i><span data-i18n="addonStore.submitOnGithub">Заявка на GitHub</span></button></div>
    </main>
    <footer>
        <section id="transfer" class="transfer" hidden aria-label="Загрузка пакета" data-i18n-aria-label="addonStore.transfer.footer">
            <div class="transfer-heading"><strong id="transfer-name"></strong><span id="transfer-phase"></span></div>
            <progress id="transfer-progress" max="100" aria-label="Прогресс загрузки" data-i18n-aria-label="addonStore.transfer.progress"></progress>
            <div class="transfer-stats"><span id="transfer-size"></span><span id="transfer-speed"></span><span id="transfer-percent"></span></div>
        </section>
        <div class="footer-line"><span id="status" role="status" aria-live="polite"></span><span class="footer-note" data-i18n="marketplace.confirmation">Установка — с вашим подтверждением</span></div>
    </footer>
<script src="../core/i18n-initial.js"></script>
</body>
</html>
