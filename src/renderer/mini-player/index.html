<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="miniPlayer.noctuneMiniPlayer">Noctune — Мини-плеер</title>
    <link rel="stylesheet" href="../styles/app.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="../../../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script defer src="colors.js"></script>
    <script defer src="app.js"></script>
<script src="../../shared/i18n.js"></script>
<script src="../core/i18n.js"></script>
</head>
<body data-theme="dark">
    <main id="floating-player" aria-label="Мини-плеер Noctune" data-i18n-aria-label="miniPlayer.noctuneMiniPlayer.label">
        <div class="drag-handle" title="Перетащить мини-плеер" data-i18n-title="miniPlayer.dragMiniPlayer"></div>
        <div class="artwork" id="artwork"><i data-lucide="music"></i><img id="cover" alt="Обложка трека" hidden data-i18n-alt="miniPlayer.trackArtwork"></div>
        <div class="content">
            <div class="track-info" id="track-info">
                <div class="title" id="title" data-i18n="player.interface.noMusicSelected">Музыка не выбрана</div>
                <div class="artist" id="artist">Noctune</div>
            </div>
            <div class="transport" id="transport" role="group" aria-label="Воспроизведение" data-i18n-aria-label="settings.player.playback">
                <button class="mini-btn extra-control" data-action="lyrics" title="Текст песни" aria-label="Текст песни" data-i18n-title="player.interface.lyrics" data-i18n-aria-label="player.interface.lyrics"><i data-lucide="text-initial"></i></button>
                <button class="mini-btn extra-control" data-action="shuffle" title="Случайный порядок" aria-label="Случайный порядок" aria-pressed="false" data-i18n-title="player.interface.shuffle" data-i18n-aria-label="player.interface.shuffle"><i data-lucide="shuffle"></i></button>
                <button class="mini-btn" data-action="prev" title="Предыдущий трек" aria-label="Предыдущий трек" data-i18n-title="miniPlayer.previousTrack" data-i18n-aria-label="miniPlayer.previousTrack"><i data-lucide="skip-back"></i></button>
                <button class="mini-btn play-pause" data-action="playpause" title="Воспроизвести" aria-label="Воспроизвести" data-i18n-title="player.interface.play" data-i18n-aria-label="player.interface.play"><i data-lucide="play"></i></button>
                <button class="mini-btn" data-action="next" title="Следующий трек" aria-label="Следующий трек" data-i18n-title="miniPlayer.nextTrack" data-i18n-aria-label="miniPlayer.nextTrack"><i data-lucide="skip-forward"></i></button>
                <button class="mini-btn extra-control" data-action="repeat" title="Повтор выключен" aria-label="Повтор выключен" data-i18n-title="playback.repeat.off" data-i18n-aria-label="playback.repeat.off"><i data-lucide="repeat"></i></button>
                <button class="mini-btn" data-action="mute" title="Выключить звук" aria-label="Выключить звук" data-i18n-title="player.interface.mute" data-i18n-aria-label="player.interface.mute"><i data-lucide="volume-2"></i></button>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость" data-i18n-aria-label="playback.volume.label">
            </div>
            <div class="timeline" id="timeline">
                <span id="elapsed">0:00</span>
                <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Позиция воспроизведения" data-i18n-aria-label="player.interface.playbackPosition">
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="window-controls" role="group" aria-label="Окно мини-плеера" data-i18n-aria-label="miniPlayer.miniPlayerWindow">
            <button class="mini-btn close" data-action="close" title="Скрыть мини-плеер" aria-label="Скрыть мини-плеер" data-i18n-title="miniPlayer.hideMiniPlayer" data-i18n-aria-label="miniPlayer.hideMiniPlayer"><i data-lucide="x"></i></button>
            <button class="mini-btn" data-action="expand" title="Развернуть плеер" aria-label="Развернуть плеер" data-i18n-title="miniPlayer.expandPlayer" data-i18n-aria-label="miniPlayer.expandPlayer"><i data-lucide="maximize-2"></i></button>
            <button class="mini-btn" data-action="pin" title="Поверх всех окон" aria-label="Поверх всех окон" aria-pressed="false" data-i18n-title="miniPlayer.alwaysOnTop" data-i18n-aria-label="miniPlayer.alwaysOnTop"><i data-lucide="pin"></i></button>
            <button class="mini-btn" data-action="settings" title="Настройки мини-плеера" aria-label="Настройки мини-плеера" data-i18n-title="miniPlayer.miniPlayerSettings" data-i18n-aria-label="miniPlayer.miniPlayerSettings"><i data-lucide="settings-2"></i></button>
        </div>
    </main>
<script src="../core/i18n-initial.js"></script>
</body>
</html>
