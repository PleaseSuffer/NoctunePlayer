name: Extension or theme catalog submission
description: Submit an extension or theme for manual community catalog review.
title: "[Catalog] "
body:
  - type: markdown
    attributes:
      value: "Submissions are reviewed manually. Submission does not publish a package or make it official. Do not include private keys, tokens or user data."
  - type: dropdown
    id: kind
    attributes:
      label: Package type
      options:
        - Extension or integration (.noctaddon)
        - Interactive theme (.noctheme)
    validations:
      required: true
  - type: input
    id: addon-id
    attributes:
      label: Extension or theme ID
      placeholder: my-extension
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Public source repository
      placeholder: https://github.com/OWNER/REPOSITORY
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Release package URL (.noctaddon or .noctheme)
      placeholder: https://github.com/OWNER/REPOSITORY/releases/download/TAG/my-extension.noctaddon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, revision (extensions only) and minimum Noctune version
      placeholder: "1.0.0, revision 1, Noctune 1.4.0"
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License and license file URL
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: Package SHA-256
    validations:
      required: true
  - type: input
    id: publisher
    attributes:
      label: Publisher public key fingerprint, if signed (SHA-256 of Ed25519 SPKI)
  - type: textarea
    id: description
    attributes:
      label: Features and settings
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions, domains and data handling
      description: Explain each permission, authentication, storage and network access.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Build instructions and validation
      description: Source tag or commit, reproducible packaging steps, tested platforms and known limitations.
    validations:
      required: true
